[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-desk"
version = "0.1.0"
description = "Grid Drift Tribunal + Twilio email agent on quarantine/mistrial/fleet_hold."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.36.0"]

[tool.hatch.build.targets.wheel]
packages = ["fleet_desk"]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.40.0"
fab-include = ["fleet_desk/**/*.py", "pyproject.toml", "LICENSE", "email_watch.py"]

[tool.flwr.app.components]
agentapp = "fleet_desk.agent_app:app"
